name: Update football data

on:
  schedule:
    # Her saat 15 geçe çalışır. UTC saat dilimidir.
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-football-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Fetch football data
        run: npm run fetch-data
        env:
          FOOTBALL_API_BASE_URL: ${{ vars.FOOTBALL_API_BASE_URL || 'https://v3.football.api-sports.io' }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          LEAGUE_IDS: ${{ vars.LEAGUE_IDS || '203' }}
          SEASON: ${{ vars.SEASON || '2026' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Europe/Istanbul' }}
          FETCH_ODDS: ${{ vars.FETCH_ODDS || 'false' }}
          MAX_ODDS_FIXTURES: ${{ vars.MAX_ODDS_FIXTURES || '10' }}
          REQUEST_DELAY_MS: ${{ vars.REQUEST_DELAY_MS || '1200' }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/combined.json

          if git diff --staged --quiet; then
            echo "Veri değişmedi"
          else
            git commit -m "chore(data): güncel maç ve puan durumu $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
