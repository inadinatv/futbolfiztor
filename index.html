<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol Analiz Merkezi</title>
    <style>
        :root { --bg: #0f172a; --surface: #1e293b; --primary: #3b82f6; --text: #f8fafc; --text-muted: #94a3b8; --border: #334155; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        header { background: rgba(30, 41, 59, 0.9); padding: 1.5rem; text-align: center; border-bottom: 1px solid var(--border); }
        h1 { margin: 0; font-size: 1.8rem; } h1 span { color: var(--primary); }
        #update-time { color: var(--text-muted); font-size: 0.9rem; margin-top: 10px; }
        
        .tabs { display: flex; justify-content: center; gap: 15px; padding: 15px; }
        .tab-btn { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 10px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .tab-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
        
        .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .news-card { background: var(--surface); border-radius: 12px; padding: 20px; border: 1px solid var(--border); margin-bottom: 15px; }
        .news-title { font-size: 1.2rem; margin: 0 0 10px 0; color: var(--primary); }
        
        .table-container { overflow-x: auto; background: var(--surface); border-radius: 12px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 16px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: rgba(0,0,0,0.3); color: var(--text-muted); }
        .pos { width: 32px; height: 32px; background: #334155; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 0.9rem; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1>⚽ Futbol <span>Merkezi</span></h1>
    <div id="update-time">Son Güncelleme: Kontrol Ediliyor...</div>
</header>

<div class="tabs">
    <button class="tab-btn active" onclick="switchTab('analiz')">Sistem & Analiz</button>
    <button class="tab-btn" onclick="switchTab('puan')">Puan Durumu</button>
</div>

<div class="container">
    <div id="analiz" class="tab-content active">
        <div id="news-container">İçerikler yükleniyor...</div>
    </div>

    <div id="puan" class="tab-content">
        <div class="table-container">
            <table>
                <thead>
                    <tr><th>Sıra</th><th>Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th>Puan</th></tr>
                </thead>
                <tbody id="standings-body">
                    <tr><td colspan="7">Yükleniyor...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content, .tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    async function loadData() {
        try {
            const res = await fetch('data.json?v=' + new Date().getTime());
            const data = await res.json();

            document.getElementById('update-time').innerText = "Son Veri Güncellemesi: " + data.last_update;

            document.getElementById('news-container').innerHTML = data.analysis.map(item => `
                <div class="news-card">
                    <h3 class="news-title">${item.title}</h3>
                    <p style="color:var(--text-muted); line-height:1.5;">${item.desc}</p>
                </div>
            `).join('');

            document.getElementById('standings-body').innerHTML = data.standings.map(t => `
                <tr>
                    <td><span class="pos">${t.pos}</span></td>
                    <td style="font-weight:600;">${t.team}</td>
                    <td>${t.played || t.p}</td>
                    <td>${t.won || t.w}</td>
                    <td>${t.drawn || t.d}</td>
                    <td>${t.lost || t.l}</td>
                    <td><strong style="color:var(--primary); font-size:1.1rem;">${t.points || t.pts}</strong></td>
                </tr>
            `).join('');
            
        } catch (e) {
            document.getElementById('news-container').innerHTML = '<div class="news-card"><h3 class="news-title">🔴 Kritik Hata</h3><p>data.json dosyası GitHub tarafından oluşturulmamış veya Vercel bağlantısı kopmuş. Lütfen GitHub Actions sekmesini kontrol et.</p></div>';
        }
    }
    loadData();
</script>
</body>
</html>
