<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol Merkezi - Özetler, Puan Durumu & Fikstür</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #22c55e;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 0;
        }
        header {
            background: #020617;
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        h1 { margin: 0; font-size: 1.5rem; color: var(--accent); }
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            background: #0f172a;
            padding: 10px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .tab-btn {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
        }
        .tab-btn.active {
            background: var(--accent);
            color: #000;
        }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Video Grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }
        .video-card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        iframe { width: 100%; height: 200px; border: none; }

        /* Tablo */
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #020617; color: var(--accent); }
    </style>
</head>
<body>

<header>
    <h1>⚽ TR Futbol Merkezi</h1>
</header>

<div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('ozetler')">🎬 Maç Özetleri</button>
    <button class="tab-btn" onclick="switchTab('puan')">📊 Puan Durumu</button>
</div>

<div class="container">
    <!-- Özetler Sekmesi -->
    <div id="ozetler" class="tab-content active">
        <div class="video-grid" id="highlights-container">
            <p>Özetler yükleniyor...</p>
        </div>
    </div>

    <!-- Puan Durumu Sekmesi -->
    <div id="puan" class="tab-content">
        <table>
            <thead>
                <tr>
                    <th>Sıra</th>
                    <th>Takım</th>
                    <th>O</th>
                    <th>G</th>
                    <th>B</th>
                    <th>M</th>
                    <th>Puan</th>
                </tr>
            </thead>
            <tbody id="standings-body">
                <tr><td colspan="7">Yükleniyor...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    async function loadData() {
        try {
            const res = await fetch('data.json?v=' + new Date().getTime());
            const data = await res.json();

            // Özetleri Bas
            const hContainer = document.getElementById('highlights-container');
            hContainer.innerHTML = data.highlights.map(item => `
                <div class="video-card">
                    <iframe src="${item.embed}" allowfullscreen></iframe>
                </div>
            `).join('');

            // Puan Durumunu Bas
            const sBody = document.getElementById('standings-body');
            sBody.innerHTML = data.standings.map(t => `
                <tr>
                    <td><b>${t.pos}</b></td>
                    <td>${t.team}</td>
                    <td>${t.p}</td>
                    <td>${t.w}</td>
                    <td>${t.d}</td>
                    <td>${t.l}</td>
                    <td><b>${t.pts}</b></td>
                </tr>
            `).join('');
        } catch (e) {
            console.error("Veri yüklenemedi:", e);
        }
    }

    loadData();
</script>
</body>
</html>
